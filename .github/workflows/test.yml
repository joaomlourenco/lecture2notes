name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is the oldest version the script supports. ubuntu-latest (now Ubuntu 26.04) has no 3.9 build and
          # the Apple Silicon macOS runners have none either, so those run an older Ubuntu / only the newest Python.
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # ffmpeg is the only program the tests need (for the smoke test); Whisper, LaTeX and the rest are not needed
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: The script starts
        shell: bash
        run: |
          python lecture2notes.py --version
          python lecture2notes.py --help > /dev/null
          python lecture2notes.py --check || true   # the exit code depends on what is installed

      - name: Tests
        run: python -m unittest discover -s tests -v
