name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest   # no Python 3.9 build for the Apple Silicon runners
            python: "3.9"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # ffmpeg is the only program the tests need (for the smoke test); Whisper, LaTeX and the rest are not needed
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: The script starts
        shell: bash
        run: |
          python lecture2notes.py --version
          python lecture2notes.py --help > /dev/null
          python lecture2notes.py --check || true   # the exit code depends on what is installed

      - name: Tests
        run: python -m unittest discover -s tests -v
